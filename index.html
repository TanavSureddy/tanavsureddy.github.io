<script>
// ─────────────────────────────────────────────
//  QUARTERLY DATE RANGE (hardcoded logic)
// ─────────────────────────────────────────────
function getHeatmapRange() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth(); // 0-indexed

    // Always start from Jan 1 of current year
    const startDate = new Date(year, 0, 1); // Jan 1

    // End date: end of the current quarter
    let endDate;
    if (month <= 2) {
        // Q1: Jan–Mar → show only through Mar 31
        endDate = new Date(year, 2, 31);
    } else if (month <= 5) {
        // Q2: Apr–Jun → show through Jun 30
        endDate = new Date(year, 5, 30);
    } else if (month <= 8) {
        // Q3: Jul–Sep → show through Sep 30
        endDate = new Date(year, 8, 30);
    } else {
        // Q4: Oct–Dec → show full year through Dec 31
        endDate = new Date(year, 11, 31);
    }

    return { startDate, endDate, year };
}

// ─────────────────────────────────────────────
//  FETCH COMMITS via GitHub contribution data
//  (uses undocumented but stable contribution calendar query)
// ─────────────────────────────────────────────
async function fetchCommitCounts(username, year) {
    // GitHub's GraphQL API requires auth, so we use the public contribution
    // proxy approach: fetch the user's contribution SVG from github.com,
    // parse the data-date and data-count attributes.
    // Note: this works client-side with a CORS proxy for .io sites.
    // We use a reliable public CORS proxy.
    const url = `https://github-contributions-api.jogruber.de/v4/${username}?y=${year}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Contributions API error');
    const json = await resp.json();
    // Returns { total: {year: N}, contributions: [{date, count, level}] }
    const map = {};
    for (const entry of json.contributions) {
        map[entry.date] = entry.count; // "YYYY-MM-DD" → count
    }
    return map;
}

// ─────────────────────────────────────────────
//  DRAW HEATMAP ON CANVAS
// ─────────────────────────────────────────────
function drawHeatmap(commitMap, startDate, endDate) {
    const canvas = document.getElementById('heatmap-canvas');
    const ctx = canvas.getContext('2d');

    const CELL = 11;   // cell size px
    const GAP  = 2;    // gap between cells
    const STEP = CELL + GAP;
    const TOP_OFFSET = 18; // space for month labels

    // Build list of dates in range
    const dates = [];
    const d = new Date(startDate);
    while (d <= endDate) {
        dates.push(new Date(d));
        d.setDate(d.getDate() + 1);
    }

    // Determine first Sunday on or before startDate (for column alignment)
    const firstDay = new Date(startDate);
    const dow = firstDay.getDay(); // 0=Sun
    firstDay.setDate(firstDay.getDate() - dow);

    // Count total columns (weeks)
    const lastDay = new Date(endDate);
    const lastDow = lastDay.getDay();
    const lastSunday = new Date(lastDay);
    lastSunday.setDate(lastDay.getDate() - lastDow);
    const msPerWeek = 7 * 24 * 3600 * 1000;
    const totalWeeks = Math.round((lastSunday - firstDay) / msPerWeek) + 1;

    const W = totalWeeks * STEP + 2;
    const H = 7 * STEP + TOP_OFFSET + 2;
    canvas.width  = W;
    canvas.height = H;

    // Color scale: 0 → empty, 1→4 → shades of dark red
    const COLORS = ['#ebedf0', '#f5c0c0', '#d97474', '#b83030', '#8b0000'];
    function countToColor(count) {
        if (!count || count === 0) return COLORS[0];
        if (count <= 2)  return COLORS[1];
        if (count <= 5)  return COLORS[2];
        if (count <= 10) return COLORS[3];
        return COLORS[4];
    }

    // Draw month labels
    ctx.font = '9px sans-serif';
    ctx.fillStyle = '#999';
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let lastMonthDrawn = -1;
    // iterate week columns
    for (let w = 0; w < totalWeeks; w++) {
        const weekStart = new Date(firstDay.getTime() + w * msPerWeek);
        const mo = weekStart.getMonth();
        if (mo !== lastMonthDrawn && weekStart >= startDate && weekStart <= endDate) {
            ctx.fillText(MONTHS[mo], w * STEP, TOP_OFFSET - 6);
            lastMonthDrawn = mo;
        }
    }

    // Draw cells
    // Store cell positions for tooltip
    const cellData = []; // {x, y, w, h, date, count}

    for (const date of dates) {
        const dateStr = date.toISOString().slice(0, 10);
        const count = commitMap[dateStr] || 0;

        // Which column (week)?
        const diffMs = date - firstDay;
        const col = Math.floor(diffMs / msPerWeek);
        const row = date.getDay(); // 0=Sun

        const x = col * STEP;
        const y = TOP_OFFSET + row * STEP;

        ctx.fillStyle = countToColor(count);
        ctx.beginPath();
        ctx.roundRect(x, y, CELL, CELL, 2);
        ctx.fill();

        cellData.push({ x, y, w: CELL, h: CELL, date: dateStr, count });
    }

    return cellData;
}

// ─────────────────────────────────────────────
//  TOOLTIP
// ─────────────────────────────────────────────
function setupTooltip(canvas, cellData) {
    const tooltip = document.getElementById('hm-tooltip');
    const rect = () => canvas.getBoundingClientRect();
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    canvas.addEventListener('mousemove', (e) => {
        const r = rect();
        const mx = e.clientX - r.left;
        const my = e.clientY - r.top;

        let found = null;
        for (const cell of cellData) {
            if (mx >= cell.x && mx <= cell.x + cell.w &&
                my >= cell.y && my <= cell.y + cell.h) {
                found = cell;
                break;
            }
        }

        if (found) {
            const d = new Date(found.date + 'T00:00:00');
            const label = `${found.count} commit${found.count !== 1 ? 's' : ''} on ${DAYS[d.getDay()]}, ${found.date}`;
            tooltip.textContent = label;
            tooltip.style.opacity = '1';
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top  = (e.clientY - 28) + 'px';
        } else {
            tooltip.style.opacity = '0';
        }
    });

    canvas.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
    });
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
(async function initHeatmap() {
    const username = 'TanavSureddy';
    const { startDate, endDate, year } = getHeatmapRange();

    document.getElementById('hm-year-label').textContent = year;

    try {
        const commitMap = await fetchCommitCounts(username, year);
        const cellData = drawHeatmap(commitMap, startDate, endDate);
        setupTooltip(document.getElementById('heatmap-canvas'), cellData);
    } catch (err) {
        console.error('Heatmap error:', err);
        document.getElementById('heatmap-section').style.display = 'none';
    }
})();

// ─────────────────────────────────────────────
//  REPOS
// ─────────────────────────────────────────────
(async function(){
    const username = 'TanavSureddy';
    const container = document.getElementById('repos');
    try {
        const resp = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
        if(!resp.ok) throw new Error('GitHub API error');
        let repos = await resp.json();
        const exclude = new Set(['tanavsureddy.github.io', 'tanavsureddy']);
        repos = repos.filter(r => !exclude.has(String(r.name).toLowerCase()));
        repos.sort((a,b) => new Date(b.pushed_at) - new Date(a.pushed_at));
        if(!repos.length){ container.innerHTML = '<div class="news-item">No public repositories found.</div>'; return; }
        container.innerHTML = '';
        repos.forEach(repo => {
            const item = document.createElement('div');
            item.className = 'news-item';
            const a = document.createElement('a');
            a.href = repo.html_url;
            a.textContent = repo.name;
            a.className = 'repo-name';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            item.appendChild(a);
            if(repo.description){
                const d = document.createElement('div');
                d.className = 'repo-desc';
                d.textContent = repo.description;
                item.appendChild(d);
            }
            container.appendChild(item);
        });
    } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="news-item">Error loading repositories.</div>';
    }
})();
</script>
